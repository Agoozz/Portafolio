<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgendaProfe | Agenda</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold text-primary" href="inicio.html">
      <i class="bi bi-journal-check me-2"></i>AgendaProfe
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto gap-lg-3">
        <li class="nav-item"><a class="nav-link" href="inicio.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="alumnos.html">Alumnos</a></li>
        <li class="nav-item"><a class="nav-link active" href="agenda.html">Agenda</a></li>
        <li class="nav-item"><a class="nav-link" href="pagos.html">Pagos</a></li>
        <li class="nav-item"><a class="nav-link" href="packs.html">Materias y Packs</a></li>
        <li class="nav-item"><a class="nav-link" href="reportes.html">Reportes</a></li>
        <li class="nav-item">
          <a class="btn btn-outline-primary rounded-4 px-3 ms-lg-2" href="../index.html">
            <i class="bi bi-box-arrow-right me-1"></i>Salir
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
    <div>
      <p class="text-primary fw-semibold mb-1">Agenda</p>
      <h1 class="h3 mb-0">Calendario de clases</h1>
    </div>
    <button class="btn btn-primary rounded-3" type="button" id="btnNuevaClase">
      <i class="bi bi-calendar-plus me-1"></i>Agregar clase
    </button>
  </div>

  <section class="card border-0 shadow-sm rounded-4">
    <div class="card-body">
      <div class="d-flex flex-column flex-md-row justify-content-between gap-3 align-items-md-center mb-3">
        <div>
          <p class="text-primary fw-semibold mb-1">Programación</p>
          <h2 class="h4 mb-0">Clases agendadas</h2>
        </div>
        <span class="badge bg-primary-subtle text-primary" id="contadorClases">0 clases</span>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label" for="busquedaAlumno">Buscar por alumno</label>
          <input type="text" class="form-control rounded-3" id="busquedaAlumno" placeholder="Ej: Juan Pérez">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="filtroEstadoClase">Filtrar por estado</label>
          <select class="form-select rounded-3" id="filtroEstadoClase">
            <option value="">Todos</option>
            <option value="Programada" selected>Programada</option>
            <option value="Completada">Completada</option>
            <option value="Cancelada">Cancelada</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle custom-table">
          <thead class="table-light">
            <tr>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Alumno</th>
              <th>Materia</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="agendaTableBody"></tbody>
        </table>
      </div>

      <!-- Paginación -->
      <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
        <div class="small text-muted" id="infoPaginado">Mostrando 0-0 de 0 clases</div>
        <nav aria-label="Navegación de páginas">
          <ul class="pagination pagination-sm mb-0 shadow-sm border-0 rounded-3" id="controlPaginado">
          </ul>
        </nav>
      </div>
    </div>
  </section>
</main>

<div class="modal fade" id="modalClase" tabindex="-1" aria-labelledby="modalClaseLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4">
      <div class="modal-header border-0">
        <div>
          <p class="text-primary fw-semibold mb-1" id="modalClaseLabel">Clase</p>
          <h2 class="h4 mb-0">Crear o editar clase</h2>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <form id="agendaForm">
          <input type="hidden" id="claseId">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="fechaClase">Fecha</label>
              <input type="date" class="form-control rounded-3" id="fechaClase" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="horaClase">Hora</label>
              <input type="time" class="form-control rounded-3" id="horaClase" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="alumnoClase">Alumno</label>
              <select class="form-select rounded-3" id="alumnoClase" required></select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="materiaClase">Materia</label>
              <select class="form-select rounded-3" id="materiaClase" required>
                <option value="">Seleccioná una materia</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="estadoClase">Estado</label>
              <select class="form-select rounded-3" id="estadoClase" required>
                <option value="Programada">Programada</option>
                <option value="Completada">Completada</option>
                <option value="Cancelada">Cancelada</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="observacionesClase">Observaciones</label>
              <textarea class="form-control rounded-3" id="observacionesClase" rows="3" placeholder="Notas, tema o recordatorios"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button class="btn btn-outline-secondary rounded-3" type="button" id="cancelarClase" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary rounded-3" type="submit" id="guardarClaseBtn" form="agendaForm">Guardar clase</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/auth-ui.js"></script>
<script src="../js/agenda.js"></script>
</body>
</html>
