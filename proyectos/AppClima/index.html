<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima Premium</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="sky-default">
    
    <!-- Botón Volver (Flotante) -->
    <a href="../../index.html" class="back-link"><i class="ph ph-arrow-left"></i> Portafolio</a>

    <div class="container">
        
        <!-- Buscador Estilo Spotlight -->
        <div class="search-bar frosted">
            <i class="ph ph-magnifying-glass search-icon"></i>
            <input type="text" id="city-input" placeholder="Buscar ciudad..." autocomplete="off">
            <button id="search-btn" class="btn-invisible">Buscar</button>
        </div>

        <!-- Cargando / Error -->
        <div id="status-container" class="status-box frosted hidden">
            <p id="status-msg"><i class="ph ph-spinner-gap spin"></i> Buscando...</p>
        </div>

        <!-- Widget del Clima Principal -->
        <div id="weather-widget" class="weather-widget hidden">
            
            <!-- Cabecera Principal (Ciudad y Temp) -->
            <div class="main-info">
                <h1 id="city-name">Ciudad</h1>
                <p id="weather-desc" class="desc">Condición</p>
                <div class="huge-temp">
                    <span id="temperature">0</span>°
                </div>
                <div class="min-max">
                    <span>Mín: <span id="temp-min">0</span>°</span>
                    <span>Máx: <span id="temp-max">0</span>°</span>
                </div>
            </div>

            <!-- Grilla de Detalles -->
            <div class="details-grid">
                
                <!-- Sensación Térmica -->
                <div class="detail-card frosted">
                    <div class="detail-header">
                        <i class="ph ph-thermometer"></i> SENSACIÓN TÉRMICA
                    </div>
                    <div class="detail-value">
                        <span id="feels-like">0</span>°
                    </div>
                </div>

                <!-- Humedad -->
                <div class="detail-card frosted">
                    <div class="detail-header">
                        <i class="ph ph-drop"></i> HUMEDAD
                    </div>
                    <div class="detail-value">
                        <span id="humidity">0</span>%
                    </div>
                </div>

                <!-- Viento -->
                <div class="detail-card frosted">
                    <div class="detail-header">
                        <i class="ph ph-wind"></i> VIENTO
                    </div>
                    <div class="detail-value">
                        <span id="wind">0</span> km/h
                    </div>
                </div>

                <!-- Ícono Decorativo -->
                <div class="detail-card frosted flex-center">
                    <i id="weather-icon" class="ph ph-sun weather-icon-large"></i>
                </div>
            </div>

            <!-- Insight / Recomendación Inteligente -->
            <div class="insight-card frosted">
                <div class="insight-header">
                    <i class="ph ph-sparkle"></i> INSIGHT DEL DÍA
                </div>
                <p id="recommendation-text">Cargando recomendación...</p>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
