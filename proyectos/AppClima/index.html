<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima Premium</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="sky-default">
    
    <!-- Orbes de Luz para resaltar el efecto de cristal -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <!-- Botón Volver (Flotante) -->
    <a href="../../index.html" class="back-link"><i class="ph ph-arrow-left"></i> Portafolio</a>

    <div class="container">
        
        <!-- Buscador Estilo Spotlight -->
        <div class="search-bar frosted">
            <i class="ph ph-magnifying-glass search-icon"></i>
            <input type="text" id="city-input" placeholder="Buscar ciudad (Ej: Córdoba Argentina)..." autocomplete="off">
            <button id="search-btn" class="btn-invisible">Buscar</button>
        </div>

        <!-- Cargando / Error -->
        <div id="status-container" class="status-box frosted hidden">
            <p id="status-msg"><i class="ph ph-spinner-gap spin"></i> Buscando...</p>
        </div>

        <!-- Widget del Clima Principal -->
        <div id="weather-widget" class="weather-widget hidden frosted-widget">
            
            <!-- Banner Fotográfico de la Ciudad -->
            <div class="city-banner">
                <img id="city-image" src="" alt="Foto de la ciudad" class="hidden">
                <div id="city-banner-overlay" class="city-banner-overlay hidden"></div>
                
                <!-- Cabecera Principal superpuesta -->
                <div class="main-info">
                    <h1 id="city-name">Ciudad</h1>
                    <div class="location-desc">
                        <span id="city-location">Provincia, País</span>
                        <img id="flag-icon" src="" alt="Bandera" class="hidden flag-img">
                    </div>
                    <p id="weather-desc" class="desc">Condición</p>
                    <div class="huge-temp">
                        <span id="temperature">0</span>°
                    </div>
                    <div class="min-max">
                        <span>Mín: <span id="temp-min">0</span>°</span>
                        <span>Máx: <span id="temp-max">0</span>°</span>
                    </div>
                </div>
            </div>

            <div class="widget-body">
                <!-- Grilla de Detalles -->
                <div class="details-grid">
                    
                    <!-- Sensación Térmica -->
                    <div class="detail-card frosted-inner">
                        <div class="detail-header">
                            <i class="ph-fill ph-thermometer"></i> SENSACIÓN
                        </div>
                        <div class="detail-value">
                            <span id="feels-like">0</span>°
                        </div>
                        <div class="detail-subtitle" id="feels-like-desc">Similar a la real</div>
                    </div>

                    <!-- Humedad -->
                    <div class="detail-card frosted-inner">
                        <div class="detail-header">
                            <i class="ph-fill ph-drop"></i> HUMEDAD
                        </div>
                        <div class="detail-value">
                            <span id="humidity">0</span>%
                        </div>
                        <div class="detail-subtitle" id="humidity-desc">Normal</div>
                    </div>

                    <!-- Viento -->
                    <div class="detail-card frosted-inner">
                        <div class="detail-header">
                            <i class="ph-fill ph-wind"></i> VIENTO
                        </div>
                        <div class="detail-value">
                            <span id="wind">0</span> <span style="font-size: 0.9rem">km/h</span>
                        </div>
                        <div class="detail-subtitle" id="wind-desc">Brisa suave</div>
                    </div>

                    <!-- Ícono Decorativo -->
                    <div class="detail-card frosted-inner flex-center icon-card">
                        <i id="weather-icon" class="ph-fill ph-sun weather-icon-large"></i>
                    </div>
                </div>

                <!-- Insight / Recomendación Inteligente -->
                <div class="insight-card frosted-inner">
                    <div class="insight-header">
                        <i class="ph-fill ph-sparkle" style="color: #ffd700;"></i> INSIGHT DEL DÍA
                    </div>
                    <p id="recommendation-text">Cargando recomendación...</p>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
