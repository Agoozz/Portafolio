<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria Premium</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- Botón Volver -->
    <a href="../../index.html" class="back-link"><i class="ph ph-arrow-left"></i> Portafolio</a>

    <!-- Círculos de fondo para el efecto Glassmorphism -->
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>

    <!-- ================= PANTALLA DE MENÚ ================= -->
    <div id="menu-screen" class="menu-container frosted">
        <header class="menu-header">
            <h1>Configurar Partida</h1>
            <p>Elige tu reto y demuestra tu memoria.</p>
        </header>

        <div class="menu-options">
            <!-- Temática -->
            <div class="option-group">
                <h3>Temática</h3>
                <div class="radio-buttons">
                    <label class="radio-label">
                        <input type="radio" name="theme" value="space" checked>
                        <span class="radio-custom">🚀 Espacio</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="theme" value="food">
                        <span class="radio-custom">🍔 Comida</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="theme" value="animals">
                        <span class="radio-custom">🦊 Animales</span>
                    </label>
                </div>
            </div>

            <!-- Dificultad -->
            <div class="option-group">
                <h3>Dificultad</h3>
                <div class="radio-buttons">
                    <label class="radio-label">
                        <input type="radio" name="difficulty" value="8">
                        <span class="radio-custom">Fácil (8)</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="difficulty" value="16" checked>
                        <span class="radio-custom">Medio (16)</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="difficulty" value="24">
                        <span class="radio-custom">Difícil (24)</span>
                    </label>
                </div>
            </div>
        </div>

        <button id="start-btn" class="btn-primary btn-large">¡Jugar Ahora!</button>
    </div>

    <!-- ================= PANTALLA DE JUEGO ================= -->
    <div id="game-screen" class="game-container frosted hidden">
        <header class="game-header">
            <div class="header-top">
                <button id="back-to-menu-btn" class="btn-text"><i class="ph ph-caret-left"></i> Volver al Menú</button>
            </div>
            <h1>Memoria Visual</h1>
            
            <div class="stats-panel">
                <div class="stat-box">
                    <span class="stat-label">Movimientos</span>
                    <span class="stat-value" id="moves">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Tiempo</span>
                    <span class="stat-value" id="time">00:00</span>
                </div>
                <button id="restart-btn" class="btn-icon" title="Reiniciar Juego">
                    <i class="ph-bold ph-arrows-clockwise"></i>
                </button>
            </div>
        </header>

        <!-- Tablero del Juego (Las cartas se inyectan aquí con JS) -->
        <main class="game-board" id="game-board"></main>
    </div>

    <!-- Modal de Victoria -->
    <div id="win-modal" class="modal hidden">
        <div class="modal-content frosted">
            <h2>¡Mente Brillante! 🏆</h2>
            <p>Has encontrado todas las parejas.</p>
            <div class="modal-stats">
                <div>
                    <i class="ph-fill ph-swap"></i>
                    <span id="final-moves">0</span> Movimientos
                </div>
                <div>
                    <i class="ph-fill ph-timer"></i>
                    <span id="final-time">00:00</span> Tiempo
                </div>
            </div>
            <button id="play-again-btn" class="btn-primary">Jugar de Nuevo</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
