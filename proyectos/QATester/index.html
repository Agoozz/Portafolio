<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agoozz QA · Auditoría HTML</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <!-- Barra superior minimalista -->
    <header class="topbar">
        <div class="container topbar-inner">
            <div class="brand">
                <a href="../../index.html" class="back-link" title="Volver al Portafolio"><i class="ph ph-arrow-left"></i></a>
                <span class="brand-name">Agoozz<span>/qa</span></span>
                <div class="segmented-tabs">
                    <button class="mode-tab active" data-mode="custom">Analizar HTML</button>
                    <button class="mode-tab" data-mode="portfolio">Suite Portafolio (16)</button>
                </div>
            </div>
            <div class="topbar-actions">
                <button id="btn-theme-toggle" class="btn-outline" title="Cambiar Modo Claro / Oscuro">
                    <i id="theme-icon" class="ph ph-sun"></i>
                    <span id="theme-label">Modo Claro</span>
                </button>
                <button id="btn-export-report" class="btn-text"><i class="ph ph-download-simple"></i> JSON</button>
                <button id="btn-run-all" class="btn-solid"><i class="ph-fill ph-play"></i> Correr Suite</button>
            </div>
        </div>
    </header>

    <main class="container main-layout">
        <!-- Entrada limpia y unificada (Solo visible en modo Analizar HTML) -->
        <section id="custom-uploader-panel" class="input-card">
            <div class="input-toolbar">
                <div class="upload-triggers">
                    <label class="btn-outline">
                        <i class="ph ph-folder-open"></i> Subir Carpeta
                        <input type="file" id="input-folder" webkitdirectory directory multiple hidden>
                    </label>
                    <label class="btn-outline">
                        <i class="ph ph-file-code"></i> Subir Archivo
                        <input type="file" id="input-files" multiple accept=".html,.htm,.css,.js" hidden>
                    </label>
                    <button id="btn-load-demo-broken" class="btn-text">
                        Cargar ejemplo con errores
                    </button>
                </div>
                <div class="run-triggers">
                    <label class="toggle-check">
                        <input type="checkbox" id="chk-autoclick" checked>
                        <span>Testear clicks</span>
                    </label>
                    <button id="btn-audit-paste" class="btn-solid">
                        Analizar código
                    </button>
                </div>
            </div>
            <div id="dropzone">
                <textarea id="textarea-html" placeholder="Pegá tu código HTML acá o arrastrá una carpeta / archivo..."></textarea>
            </div>
        </section>

        <!-- Barra única de estado y métricas en línea -->
        <section class="summary-strip">
            <div id="portfolio-filters" class="filter-pills hidden">
                <button class="pill-btn active" data-filter="all">Todos</button>
                <button class="pill-btn" data-filter="Portafolio">Portafolio</button>
                <button class="pill-btn" data-filter="SquatGym">SquatGym</button>
                <button class="pill-btn" data-filter="Mateando">Mateando</button>
                <button class="pill-btn" data-filter="POS">POS</button>
                <button class="pill-btn" data-filter="Apps">Apps</button>
            </div>

            <div class="inline-stats">
                <span>Archivos: <strong id="stat-pages">0</strong></span>
                <span class="dot">·</span>
                <span>Botones: <strong id="stat-buttons">0</strong></span>
                <span class="dot">·</span>
                <span>Links: <strong id="stat-links">0</strong></span>
                <span class="dot">·</span>
                <span>Score: <strong id="stat-score">—</strong></span>
                <span id="badge-summary" class="status-badge neutral" style="display:none;"></span>
            </div>

            <div class="status-right">
                <span id="status-text">Listo</span>
                <span id="progress-percent" style="display:none;">0%</span>
            </div>
            <div class="progress-track">
                <div id="progress-bar" class="progress-fill"></div>
            </div>
        </section>

        <!-- Resultados + Vista previa limpia -->
        <div class="workspace">
            <section class="results-col">
                <div id="suites-container" class="suites-list"></div>
            </section>

            <aside class="preview-col">
                <div class="preview-box">
                    <div class="box-bar">
                        <span>Vista Previa (Sandbox)</span>
                        <code id="sandbox-url">idle</code>
                    </div>
                    <div class="sandbox-viewport">
                        <iframe id="qa-iframe" title="Sandbox E2E" src="about:blank"></iframe>
                        <div id="sandbox-overlay" class="sandbox-overlay">
                            <span>Sin vista previa activa</span>
                        </div>
                    </div>
                </div>

                <div class="log-box">
                    <div class="box-bar">
                        <span>Consola</span>
                        <button id="btn-clear-log" class="btn-clear">Limpiar</button>
                    </div>
                    <div id="console-output" class="console-body"></div>
                </div>
            </aside>
        </div>
    </main>

    <footer class="minimal-footer">
        <div class="container footer-row">
            <span>Agostina Fankhauser · <a href="https://github.com/Agoozz" target="_blank" rel="noopener">@Agoozz</a></span>
            <a href="../../index.html">Volver al Portafolio</a>
        </div>
    </footer>

    <script src="script.js?v=5"></script>
</body>
</html>
